export_data:
  name: Export curated entity data
  description: >-
    Build a curated list of Home Assistant entities (filtered by area and
    domain, with diagnostic/config/hidden/disabled entities removed) and
    optionally write it to a JSON file in the config directory. Use
    "return_response" to get the data back inline.
  fields:
    areas:
      name: Areas
      description: Areas to include. Leave empty for all areas.
      required: false
      selector:
        area:
          multiple: true
    domains:
      name: Domains
      description: >-
        Entity domains to include (e.g. light, switch, climate). Leave empty
        for all domains. The list below covers the standard Home Assistant
        domains; custom_value is on, so you can also type any domain not listed.
      required: false
      example: '["light", "switch", "climate"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - air_quality
            - alarm_control_panel
            - assist_satellite
            - automation
            - binary_sensor
            - button
            - calendar
            - camera
            - climate
            - conversation
            - counter
            - cover
            - date
            - datetime
            - device_tracker
            - event
            - fan
            - group
            - humidifier
            - image
            - input_boolean
            - input_button
            - input_datetime
            - input_number
            - input_select
            - input_text
            - lawn_mower
            - light
            - lock
            - media_player
            - notify
            - number
            - person
            - remote
            - scene
            - schedule
            - script
            - select
            - sensor
            - siren
            - sun
            - switch
            - text
            - time
            - timer
            - todo
            - update
            - vacuum
            - valve
            - water_heater
            - weather
            - zone
    include_diagnostic:
      name: Include diagnostic & config entities
      description: Include entities HA tags as diagnostic or config.
      required: false
      default: false
      selector:
        boolean:
    include_hidden:
      name: Include hidden entities
      description: Include entities hidden in the UI.
      required: false
      default: false
      selector:
        boolean:
    include_disabled:
      name: Include disabled entities
      description: Include entities disabled in the registry.
      required: false
      default: false
      selector:
        boolean:
    include_automations:
      name: Include automations
      description: >-
        Include full automation configs (triggers/conditions/actions) plus the
        entities, devices, and areas each automation references. When areas are
        selected, only automations referencing those areas are included.
      required: false
      default: true
      selector:
        boolean:
    include_scripts:
      name: Include scripts
      description: >-
        Include full script configs plus what each references. Area-filtered
        the same way as automations when areas are selected.
      required: false
      default: true
      selector:
        boolean:
    include_scenes:
      name: Include scenes
      description: >-
        Include scene configs (target entity states) plus what each references.
        Area-filtered the same way as automations when areas are selected.
      required: false
      default: true
      selector:
        boolean:
    include_all_attributes:
      name: Include all attributes
      description: >-
        Export every attribute each entity exposes (default) so a downstream LLM
        sees the full picture. Turn this off to strip the built-in noise list
        (rssi, battery, voltage, linkquality, supported_features, color modes,
        etc.). Ignored when "Only these attributes" is set.
      required: false
      default: true
      selector:
        boolean:
    exclude_attributes:
      name: Exclude attributes
      description: >-
        Attribute names to strip from each entity. Applies on top of whatever
        "Include all attributes" leaves in.
      required: false
      example: '["custom_noise_attr"]'
      selector:
        text:
          multiple: true
    include_attributes:
      name: Only these attributes
      description: >-
        Allowlist mode. If set, ONLY these attributes are kept per entity and
        everything else is dropped.
      required: false
      example: '["temperature", "brightness"]'
      selector:
        text:
          multiple: true
    exclude_entities:
      name: Exclude entities
      description: Specific entity_ids to drop regardless of other filters.
      required: false
      selector:
        entity:
          multiple: true
    write_file:
      name: Write file
      description: Write a timestamped export file to the config directory.
      required: false
      default: true
      selector:
        boolean:
    format:
      name: File format
      description: >-
        Format for the written file. "json" writes the full export (entities +
        automations + scripts + scenes). "csv" writes just the curated entity
        list as a flat table (one row per entity; attributes are JSON-encoded in
        a single column). Automations/scripts/scenes are not included in CSV.
      required: false
      default: json
      example: csv
      selector:
        select:
          options:
            - json
            - csv
    scope:
      name: Scope label
      description: A label stored in the file metadata and used in the filename.
      required: false
      example: whole_home
      selector:
        text:
