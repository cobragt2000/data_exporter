<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#0277BD"/>
    </linearGradient>
    <linearGradient id="exp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43D07A"/>
      <stop offset="1" stop-color="#1F9E57"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#003a57" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>

  <!-- document / curated entity list -->
  <g filter="url(#sh)">
    <rect x="128" y="96" width="210" height="272" rx="26" fill="#ffffff"/>
  </g>

  <!-- list rows with entity dots -->
  <g>
    <circle cx="166" cy="150" r="11" fill="#4FC3F7"/>
    <rect x="190" y="140" width="120" height="20" rx="10" fill="#B9E6FB"/>

    <circle cx="166" cy="200" r="11" fill="#4FC3F7"/>
    <rect x="190" y="190" width="120" height="20" rx="10" fill="#CFEFFC"/>

    <circle cx="166" cy="250" r="11" fill="#4FC3F7"/>
    <rect x="190" y="240" width="88" height="20" rx="10" fill="#CFEFFC"/>

    <circle cx="166" cy="300" r="11" fill="#4FC3F7"/>
    <rect x="190" y="290" width="104" height="20" rx="10" fill="#CFEFFC"/>
  </g>

  <!-- export badge: down arrow into tray -->
  <g filter="url(#sh)">
    <circle cx="360" cy="360" r="78" fill="url(#exp)"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <line x1="360" y1="318" x2="360" y2="372"/>
    <polyline points="334,350 360,378 386,350"/>
    <path d="M326 396 h68" />
  </g>
</svg>
